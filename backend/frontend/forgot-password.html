<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FRANK — Forgot Password</title>
    <meta name="description" content="Reset your FRANK password.">
    <link rel="icon" type="image/svg+xml" href="assets/brand/frank-icon.svg">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <div class="toast-container" id="toastContainer"></div>

    <main class="auth-centered-box">
        <!-- Top bar with theme toggle and language selector -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; width: 100%; margin-bottom: 16px;">
            <button type="button" class="btn btn-ghost btn-icon" id="themeToggleBtn" aria-label="Toggle Theme" title="Toggle Theme">
                <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <div class="lang-selector-container" id="langSelector">
                <button type="button" class="btn btn-ghost lang-btn" id="langDropdownBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
                    <svg class="lang-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="current-lang-label" id="currentLangLabel">English</span>
                    <svg class="chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="lang-dropdown-menu" id="langDropdownMenu" role="menu" aria-label="Select Language">
                    <button type="button" class="lang-option active" data-lang="en" role="menuitem">English</button>
                    <button type="button" class="lang-option" data-lang="ta" role="menuitem">தமிழ்</button>
                    <button type="button" class="lang-option" data-lang="hi" role="menuitem">हिन्दी</button>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: var(--space-6);">
            <div style="margin: 0 auto var(--space-4); display: flex; justify-content: center;">
                <img src="assets/brand/frank-icon.svg" alt="FRANK Logo" style="width: 44px; height: 44px; border-radius: 10px;">
            </div>
            <h1 class="auth-card-title" data-i18n="auth.resetPassword">Reset your FRANK password</h1>
            <p class="auth-card-subtitle" data-i18n="auth.forgotPassword">Enter your registered email address and we will send you instructions to reset your password.</p>
        </div>

        <form id="forgotPasswordForm" novalidate>
            <div class="form-group" id="groupForgotEmail">
                <label class="form-label" for="forgotEmail" data-i18n="auth.email">Email Address</label>
                <input 
                    type="email" 
                    class="form-input" 
                    id="forgotEmail" 
                    placeholder="name@example.com" 
                    data-i18n-placeholder="auth.emailPlaceholder"
                    required
                >
                <div class="form-error" id="errorForgotEmail" data-i18n="auth.invalidCredentials">Please enter a valid email address.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-large" id="forgotSubmitBtn">
                <span class="btn-text" data-i18n="auth.sendRecoveryLink">Send Reset Link</span>
            </button>
        </form>

        <div id="forgotSuccessAlert" style="display: none; margin-top: var(--space-6); padding: var(--space-4); background: var(--success-soft); border: 1px solid var(--success); border-radius: var(--radius-md); text-align: center;">
            <div style="font-weight: 700; color: var(--success); margin-bottom: 4px;">Check your inbox</div>
            <div style="font-size: 13px; color: var(--text-secondary);" id="forgotSuccessMsg">
                If an account exists with this email, we have dispatched password reset instructions.
            </div>
            <div id="resetLinkContainer" style="margin-top: 8px;"></div>
        </div>

        <div class="auth-card-footer">
            <a href="login.html" class="auth-link" style="display: inline-flex; align-items: center; gap: 4px;" data-i18n="auth.backToLogin">
                ← Back to Sign In
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const forgotForm = document.getElementById('forgotPasswordForm');
        const forgotEmail = document.getElementById('forgotEmail');
        const forgotBtn = document.getElementById('forgotSubmitBtn');
        const successBox = document.getElementById('forgotSuccessAlert');
        const resetLinkContainer = document.getElementById('resetLinkContainer');

        forgotForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = forgotEmail.value.trim();
            if (!email || !email.includes('@')) {
                document.getElementById('groupForgotEmail').classList.add('has-error');
                return;
            }
            document.getElementById('groupForgotEmail').classList.remove('has-error');

            forgotBtn.disabled = true;
            forgotBtn.querySelector('.btn-text').textContent = (typeof i18n !== 'undefined') ? i18n.t('common.loading') : 'Sending...';

            try {
                const res = await api.forgotPassword(email);
                showToast(res.message || 'Reset instructions sent.', 'success');
                successBox.style.display = 'block';

                if (res.debug_token) {
                    resetLinkContainer.innerHTML = `
                        <a href="reset-password.html?token=${encodeURIComponent(res.debug_token)}" class="btn btn-outline btn-sm" style="margin-top: 6px;">
                            Click to Open Reset Screen (Demo Token)
                        </a>
                    `;
                }
            } catch (err) {
                showToast(err.message || 'Request failed.', 'error');
            } finally {
                forgotBtn.disabled = false;
                forgotBtn.querySelector('.btn-text').textContent = (typeof i18n !== 'undefined') ? i18n.t('auth.sendRecoveryLink') : 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
