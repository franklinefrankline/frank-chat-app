<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — FRANK</title>
    <meta name="description" content="Secure administrative access for the FRANK platform.">
    <link rel="icon" type="image/svg+xml" href="assets/brand/frank-icon.svg">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page dark">

    <div class="toast-container" id="toastContainer"></div>

    <div class="auth-wrapper" style="justify-content: center; align-items: center; min-height: 100vh;">
        <div class="auth-form-container" style="max-width: 440px; width: 100%; margin: auto; padding: 20px;">
            <div class="auth-card" style="background: #0d1230; border: 1px solid #1e265c; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                <div class="auth-card-header" style="text-align: center;">
                    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
                        <div class="admin-logo-badge" style="width: 48px; height: 48px; font-size: 1.4rem;">
                            F
                        </div>
                    </div>
                    <h1 class="auth-card-title" style="font-size: 1.4rem; color: #fff; margin-bottom: 4px;">FRANK Admin Portal</h1>
                    <p style="color: #06b6d4; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;">Think</p>
                    <p class="auth-card-subtitle" style="font-size: 0.85rem; color: #94a3b8;">Restricted portal for system administrators</p>
                </div>

                <div id="adminLoginAlert" style="display: none; margin-bottom: 16px;" class="alert-box alert-danger"></div>

                <form id="adminLoginForm" novalidate>
                    <!-- Identifier Input -->
                    <div class="form-group" id="groupEmail">
                        <label class="form-label" for="adminEmail" style="color: #cbd5e1;">Admin Email or Username</label>
                        <div class="input-wrap">
                            <input 
                                type="text" 
                                class="form-input" 
                                id="adminEmail" 
                                placeholder="admin@example.com" 
                                required
                                autocomplete="username"
                                style="background: #080b24; border-color: #1e265c; color: #fff;"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group" id="groupPassword">
                        <label class="form-label" for="adminPassword" style="color: #cbd5e1;">Password</label>
                        <div class="input-wrap">
                            <input 
                                type="password" 
                                class="form-input input-icon-right" 
                                id="adminPassword" 
                                placeholder="Enter password" 
                                required
                                autocomplete="current-password"
                                style="background: #080b24; border-color: #1e265c; color: #fff;"
                            >
                            <button type="button" class="input-icon-btn password-toggle-btn" id="toggleAdminPassword" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-full btn-large" id="adminLoginSubmitBtn" style="margin-top: 10px;">
                        <span class="btn-text">Authenticate as Admin</span>
                    </button>
                </form>

                <div class="auth-card-footer" style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
                    <a href="login.html" class="auth-link" style="color: #94a3b8; display: inline-flex; align-items: center; gap: 6px;">
                        &larr; Return to FRANK User Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Password toggle
            const toggleBtn = document.getElementById('toggleAdminPassword');
            const pwdInput = document.getElementById('adminPassword');
            if (toggleBtn && pwdInput) {
                toggleBtn.addEventListener('click', () => {
                    const isPwd = pwdInput.type === 'password';
                    pwdInput.type = isPwd ? 'text' : 'password';
                });
            }

            // If already logged in as admin, verify and redirect
            if (api.getToken()) {
                try {
                    const adminUser = await api.getAdminMe();
                    if (adminUser && adminUser.role === 'admin') {
                        window.location.href = 'admin.html';
                        return;
                    }
                } catch (e) {
                    // Token invalid or not admin, proceed to login form
                }
            }

            const form = document.getElementById('adminLoginForm');
            const alertBox = document.getElementById('adminLoginAlert');
            const submitBtn = document.getElementById('adminLoginSubmitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const username = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value;

                if (!username || !password) {
                    alertBox.textContent = 'Please provide both your administrator identifier and password.';
                    alertBox.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Verifying credentials...';

                try {
                    const authRes = await api.login(username, password);
                    if (!authRes || !authRes.access_token) {
                        throw new Error('Authentication failed. No access token provided.');
                    }
                    api.setToken(authRes.access_token);

                    // Verify admin authorization on backend
                    const adminProfile = await api.getAdminMe();
                    if (!adminProfile || adminProfile.role !== 'admin') {
                        // User is authenticated but NOT an administrator
                        api.setToken(null);
                        throw new Error('Access Denied: This account does not possess administrator privileges.');
                    }

                    if (typeof showToast === 'function') {
                        showToast('Administrator authenticated. Loading portal...', 'success');
                    }
                    window.location.href = 'admin.html';
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="btn-text">Authenticate as Admin</span>';
                    alertBox.textContent = err.message || 'Login failed. Invalid administrator credentials.';
                    alertBox.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
