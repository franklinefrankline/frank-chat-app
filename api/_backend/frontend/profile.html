<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FRANK — Profile</title>
    <meta name="description" content="View and manage your FRANK profile.">
    <link rel="icon" type="image/svg+xml" href="assets/brand/frank-icon.svg">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Desktop Custom Cursor (Miniature FRANK F) -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Minimal App Header -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-8); border-bottom: 1px solid var(--border); background: var(--surface);">
        <a href="dashboard.html" class="btn btn-ghost" style="font-weight: 600;">
            ← Back to Messages
        </a>
        <a href="dashboard.html" class="brand-link" style="color: var(--text); display: flex; align-items: center; gap: 8px;">
            <img src="assets/brand/frank-icon.svg" alt="FRANK Logo" style="width: 26px; height: 26px; border-radius: 6px;">
            <span style="font-weight: 800; font-size: 17px; letter-spacing: -0.3px;">FRANK</span>
        </a>
        <div style="display: flex; gap: 8px;">
            <a href="settings.html" class="btn btn-secondary btn-sm">Settings</a>
            <button type="button" class="btn btn-outline btn-sm" id="profileLogoutBtn">Sign Out</button>
        </div>
    </header>

    <main class="profile-page-container">
        <div class="profile-card">
            <div class="profile-banner"></div>

            <div class="profile-header-content">
                <div class="profile-avatar-wrap">
                    <div class="avatar avatar-xl" id="profileAvatar">
                        <span id="profileInitials">CU</span>
                        <span class="avatar-status online" id="profileStatusDot"></span>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="toggleEditProfileBtn">
                    Edit Profile
                </button>
            </div>

            <div class="profile-info-block">
                <h1 class="profile-display-name" id="profileDisplayName">Loading User...</h1>
                <div class="profile-username" id="profileUsername">@username</div>

                <!-- Permanent 6-Character FRANK ID Card -->
                <div class="frank-id-card" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(139, 92, 246, 0.08)); border: 1px solid rgba(6, 182, 212, 0.28); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); margin: var(--space-4) 0 var(--space-6) 0;">
                    <div>
                        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-cyan); margin-bottom: 2px;">
                            Permanent FRANK ID
                        </div>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <span id="profileFrankId" style="font-family: monospace; font-size: 22px; font-weight: 800; letter-spacing: 2.5px; color: var(--text);">------</span>
                            <span style="font-size: 11px; color: var(--text-muted);">(Permanent &amp; Uneditable)</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn btn-secondary btn-sm btn-copy-frank-id" id="copyFrankIdBtn" aria-label="Copy FRANK ID" title="Copy FRANK ID" style="display: inline-flex; align-items: center; gap: 6px;">
                            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none; color: var(--success, #10B981);">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span class="copy-btn-text">Copy</span>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm" id="shareFrankIdBtn" title="Share FRANK ID">
                            🚀 Share FRANK ID
                        </button>
                    </div>
                </div>

                <p class="profile-bio-text" id="profileBioText">Bio description here.</p>


                <!-- Edit Profile Inline Form -->
                <div id="editProfileSection" style="display: none; background: var(--surface-elevated); padding: var(--space-6); border-radius: var(--radius-lg); margin-bottom: var(--space-6); border: 1px solid var(--border);">
                    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: var(--space-4);">Edit Profile Details</h3>
                    <form id="editProfileForm">
                        <div class="form-group">
                            <label class="form-label" for="editFullName">Full Name</label>
                            <input type="text" class="form-input" id="editFullName" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editBio">Bio</label>
                            <textarea class="form-textarea" id="editBio" rows="3" placeholder="Tell people a little about yourself..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editAvatarUrl">Avatar Image URL (Optional)</label>
                            <input type="url" class="form-input" id="editAvatarUrl" placeholder="https://example.com/avatar.jpg">
                        </div>
                        <div style="display: flex; gap: 8px; justify-content: flex-end;">
                            <button type="button" class="btn btn-secondary" id="cancelEditProfileBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
                        </div>
                    </form>
                </div>

                <!-- Profile Metadata Grid -->
                <div class="profile-meta-grid">
                    <div class="meta-box">
                        <span class="meta-label">Email Address</span>
                        <span class="meta-value" id="profileEmail">user@example.com</span>
                    </div>
                    <div class="meta-box">
                        <span class="meta-label">Account Created</span>
                        <span class="meta-value" id="profileJoined">September 2026</span>
                    </div>
                    <div class="meta-box">
                        <span class="meta-label">Session Status</span>
                        <span class="meta-value" style="color: var(--success);">Active &amp; Authenticated</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
