<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QENVO — Create New Password</title>
    <meta name="description" content="Set a new password for your QENVO account.">
    <link rel="icon" type="image/svg+xml" href="assets/brand/qenvo-icon.svg">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <div class="custom-cursor" id="customCursor"></div>
    <div class="custom-cursor-dot" id="customCursorDot"></div>
    <div class="toast-container" id="toastContainer"></div>

    <main class="auth-centered-box">
        <div style="text-align: center; margin-bottom: var(--space-6);">
            <div style="margin: 0 auto var(--space-4); display: flex; justify-content: center;">
                <img src="assets/brand/qenvo-icon.svg" alt="QENVO Logo" style="width: 44px; height: 44px; border-radius: 10px;">
            </div>
            <h1 class="auth-card-title">Create a new password</h1>
            <p class="auth-card-subtitle">Please enter and confirm your new secure password.</p>
        </div>

        <form id="resetPasswordForm" novalidate>
            <div class="form-group" id="groupNewPassword">
                <label class="form-label" for="newPassword">New Password</label>
                <div class="input-wrap">
                    <input 
                        type="password" 
                        class="form-input input-icon-right" 
                        id="newPassword" 
                        placeholder="At least 6 characters" 
                        required
                    >
                    <button type="button" class="input-icon-btn password-toggle-btn" data-target="newPassword" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="form-error" id="errorNewPassword">Password must be at least 6 characters.</div>
            </div>

            <div class="form-group" id="groupConfirmNewPassword">
                <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                <input 
                    type="password" 
                    class="form-input" 
                    id="confirmNewPassword" 
                    placeholder="Re-enter your password" 
                    required
                >
                <div class="form-error" id="errorConfirmNewPassword">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-large" id="resetSubmitBtn">
                <span class="btn-text">Update Password</span>
            </button>
        </form>

        <div id="resetSuccessAlert" style="display: none; margin-top: var(--space-6); padding: var(--space-4); background: var(--success-soft); border: 1px solid var(--success); border-radius: var(--radius-md); text-align: center;">
            <div style="font-weight: 700; color: var(--success); margin-bottom: 4px;">Password Updated!</div>
            <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-4);">
                Your password has been changed. You can now sign in with your new credentials.
            </div>
            <a href="login.html" class="btn btn-primary btn-full">Continue to Sign In</a>
        </div>

        <div class="auth-card-footer">
            <a href="login.html" class="auth-link">Back to Sign In</a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const resetForm = document.getElementById('resetPasswordForm');
        const newPass = document.getElementById('newPassword');
        const confirmPass = document.getElementById('confirmNewPassword');
        const resetBtn = document.getElementById('resetSubmitBtn');
        const successAlert = document.getElementById('resetSuccessAlert');

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || 'demo_token';

        resetForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = newPass.value;
            const p2 = confirmPass.value;

            let valid = true;
            if (p1.length < 6) {
                document.getElementById('groupNewPassword').classList.add('has-error');
                valid = false;
            } else {
                document.getElementById('groupNewPassword').classList.remove('has-error');
            }

            if (p1 !== p2) {
                document.getElementById('groupConfirmNewPassword').classList.add('has-error');
                valid = false;
            } else {
                document.getElementById('groupConfirmNewPassword').classList.remove('has-error');
            }

            if (!valid) return;

            resetBtn.disabled = true;
            resetBtn.querySelector('.btn-text').textContent = 'Updating...';

            try {
                const res = await api.resetPassword(token, p1);
                showToast(res.message || 'Password updated successfully!', 'success');
                resetForm.style.display = 'none';
                successAlert.style.display = 'block';
            } catch (err) {
                showToast(err.message || 'Failed to reset password.', 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.querySelector('.btn-text').textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
