databases:
  - name: frank-postgres
    databaseName: frankdb
    user: frank
    plan: free
    region: oregon

services:
  - type: web
    name: frank-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: frank-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://frank-chat-app.vercel.app
      - key: CORS_ORIGINS
        value: https://frank-chat-app.vercel.app,https://frank-chat-vercel.app,https://frank-chat-vercel.vercel.app,http://localhost:8000,http://localhost:3000
      - key: MAX_FILE_SIZE_MB
        value: "25"
